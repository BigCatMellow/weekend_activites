<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Weekend Activities · 20171</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Slab:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #efe3d1;
      --surface: #fffaf2;
      --surface-soft: #f7ead8;
      --hero-end: #f5dfc4;
      --text: #3b2c23;
      --muted: #78675b;
      --line: #dcc6aa;
      --accent: #a64f24;
      --accent-2: #6f713f;
      --accent-soft: #f1d8bd;
      --warning: #8c3f22;
      --warning-bg: #f7ddcd;
      --link: #7d371c;
      --shadow-raised: 0 1px 2px rgba(80,45,20,.05), 0 10px 28px rgba(80,45,20,.08);
      --shadow-card: 0 1px 2px rgba(80,45,20,.045), 0 3px 10px rgba(80,45,20,.04);
      --card-body: #fffaf2;
      --card-header: #efd2ad;
      --card-header-band: #d8d6ad;
      --card-accent: #a64f24;
      --card-accent-band: #6f713f;
      --action-brown: #7d4710;
      --action-brown-hover: #60350b;
      --action-green: #5f6738;
      --action-green-hover: #464d29;
      --forecast-fri-bg: #fff1d2;
      --forecast-fri-border: #e4c17a;
      --forecast-fri-label: #a65321;
      --forecast-sat-bg: #eef1df;
      --forecast-sat-border: #bdc79c;
      --forecast-sat-label: #69733f;
      --forecast-sun-bg: #eef0f5;
      --forecast-sun-border: #c7ccd8;
      --forecast-sun-label: #636a7d;
      --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-display: "Roboto Slab", Georgia, ui-serif, serif;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-7: 32px;
      --space-8: 40px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle, rgba(125,55,28,.13) 1.1px, transparent 1.35px),
        radial-gradient(circle, rgba(95,103,56,.09) 1.1px, transparent 1.35px);
      background-size: 28px 28px, 28px 28px;
      background-position: 0 0, 14px 14px;
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.5;
    }

    a { color: var(--link); }

    .page {
      width: min(960px, calc(100% - 28px));
      margin: 0 auto;
      padding: var(--space-7) 0 64px;
    }

    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--space-2);
    }

    .scope-tabs {
      display: inline-flex;
      flex: 0 0 auto;
      gap: 2px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,250,242,.82);
    }

    .scope-tabs button {
      min-height: 32px;
      border: 0;
      border-radius: 999px;
      padding: 5px 10px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color .14s ease, color .14s ease, transform .08s ease;
    }

    .scope-tabs button:hover {
      background: rgba(241,216,189,.48);
      color: var(--text);
    }

    .scope-tabs button:active {
      transform: translateY(1px);
    }

    .scope-tabs button[aria-pressed="true"] {
      background: var(--accent-soft);
      color: var(--text);
    }

    .scope-tabs button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 30px;
      background: linear-gradient(135deg, var(--surface) 0%, var(--hero-end) 100%);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow-raised);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 5px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      color: var(--text);
      font-size: clamp(34px, 7vw, 52px);
      line-height: 1.03;
      letter-spacing: -.025em;
    }

    .weekend {
      margin-top: 9px;
      color: var(--muted);
      font-size: 25px;
    }

    .weather {
      margin-top: 24px;
      padding: 15px 17px;
      background: #fffaf2;
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      color: var(--muted);
    }

    .weather strong { color: var(--text); }

    .forecast-title {
      margin: 0 0 10px;
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .forecast-day {
      display: grid;
      grid-template-columns: 86px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      min-width: 0;
      min-height: 128px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
    }

    .forecast-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      text-align: center;
    }

    .forecast-details {
      min-width: 0;
    }

    .forecast-day:nth-child(1) {
      background: var(--forecast-fri-bg);
      border-color: var(--forecast-fri-border);
      --forecast-day-label: var(--forecast-fri-label);
    }

    .forecast-day:nth-child(2) {
      background: var(--forecast-sat-bg);
      border-color: var(--forecast-sat-border);
      --forecast-day-label: var(--forecast-sat-label);
    }

    .forecast-day:nth-child(3) {
      background: var(--forecast-sun-bg);
      border-color: var(--forecast-sun-border);
      --forecast-day-label: var(--forecast-sun-label);
    }

    .forecast-icon {
      margin-bottom: 8px;
      font-size: 44px;
      line-height: 1;
    }

    .forecast-day-name {
      color: var(--forecast-day-label, var(--accent));
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .07em;
      line-height: 1.15;
      text-transform: uppercase;
    }

    .forecast-date {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      line-height: 1.2;
    }

    .forecast-temp {
      margin: 0;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      font-size: 25px;
      font-weight: 800;
      line-height: 1.15;
    }

    .forecast-temp span {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .forecast-condition {
      margin-top: 4px;
      color: var(--text);
      font-size: 13px;
      font-weight: 650;
    }

    .forecast-note {
      grid-column: 2;
      margin-top: -6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .forecast-summary {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .section { margin-top: var(--space-8); }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--accent);
    }

    .section-head h2 {
      margin: 0;
      font-family: var(--font-display);
      color: var(--text);
      font-size: 27px;
      letter-spacing: -.01em;
    }

    .section-head span {
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-4);
    }

    .best-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .card {
      --action-pair: var(--action-brown);
      --action-pair-hover: var(--action-brown-hover);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--line);
      border-top: 4px solid var(--card-accent);
      border-radius: 14px;
      background: var(--card-body);
      box-shadow: var(--shadow-card);
    }

    .card:nth-child(4n + 3),
    .card:nth-child(4n + 4) {
      --action-pair: var(--action-green);
      --action-pair-hover: var(--action-green-hover);
      border-top-color: var(--card-accent-band);
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin: -20px -20px 0;
      padding: 14px 14px 13px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--card-header);
    }

    .card:nth-child(4n + 3) .card-head,
    .card:nth-child(4n + 4) .card-head {
      background: var(--card-header-band);
    }

    .card h3 {
      margin: 0;
      font-family: var(--font-display);
      min-width: 0;
      color: var(--text);
      font-size: 23px;
      line-height: 1.18;
      letter-spacing: -.015em;
    }

    .card-head-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 10px;
    }

    .card-head-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      color: var(--text);
      text-decoration: none;
      line-height: 1;
      cursor: pointer;
    }

    .action-icon {
      display: block;
      width: 38px;
      height: 38px;
      background: currentColor;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-size: contain;
      mask-size: contain;
      transition: color .15s ease, transform .15s ease;
    }

    .action-icon-marker {
      color: var(--action-pair);
      -webkit-mask-image: url("./assets/icons/marker.svg");
      mask-image: url("./assets/icons/marker.svg");
    }

    .action-icon-calendar {
      color: var(--action-pair);
      -webkit-mask-image: url("./assets/icons/calendar-day.svg");
      mask-image: url("./assets/icons/calendar-day.svg");
    }

    .card-head-action:hover .action-icon,
    .card-head-action:focus-visible .action-icon {
      color: var(--action-pair-hover);
      transform: scale(1.04);
    }

    .card-head-action:hover,
    .card-head-action:focus-visible {
      outline: none;
    }

    .card-head-action:focus-visible {
      outline: 2px solid var(--card-accent);
      outline-offset: 2px;
      border-radius: 6px;
    }

    .meta-icon {
      display: inline-block;
      flex: 0 0 auto;
      width: 15px;
      height: 15px;
      background: currentColor;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-size: contain;
      mask-size: contain;
    }

    .meta-icon-date,
    .day-heading::before {
      -webkit-mask-image: url("./assets/icons/calendar-day.svg");
      mask-image: url("./assets/icons/calendar-day.svg");
    }

    .meta-icon-time {
      -webkit-mask-image: url("./assets/icons/clock.svg");
      mask-image: url("./assets/icons/clock.svg");
    }

    .meta-icon-place {
      -webkit-mask-image: url("./assets/icons/marker.svg");
      mask-image: url("./assets/icons/marker.svg");
    }

    .meta-icon-cost {
      -webkit-mask-image: url("./assets/icons/money.svg");
      mask-image: url("./assets/icons/money.svg");
    }

    .meta-icon-ticket {
      -webkit-mask-image: url("./assets/icons/ticket.svg");
      mask-image: url("./assets/icons/ticket.svg");
    }

    .day-heading {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
    }

    .day-heading::before {
      content: "";
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      background: var(--accent);
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-size: contain;
      mask-size: contain;
    }

    .badge {
      align-self: flex-start;
      margin-top: 9px;
      padding: 4px 7px;
      border-radius: 6px;
      background: var(--warning-bg);
      color: var(--warning);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .055em;
      text-transform: uppercase;
    }

    .facts {
      margin: 15px 0 0;
      padding-left: 12px;
      border-left: 2px solid var(--accent-soft);
    }

    .fact {
      display: grid;
      grid-template-columns: 82px minmax(0,1fr);
      gap: var(--space-2);
      margin: 6px 0;
      font-size: 13px;
    }

    .fact dt {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      color: var(--muted);
      font-weight: 700;
    }

    .fact dd {
      margin: 0;
      min-width: 0;
    }

    .description {
      margin: var(--space-4) 0 0;
      max-width: 62ch;
      color: var(--text);
      font-size: 15px;
      line-height: 1.55;
    }

    .registration {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin: var(--space-3) 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .registration .meta-icon {
      width: 14px;
      height: 14px;
      margin-top: 1px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-4);
      margin-top: auto;
      padding-top: var(--space-4);
    }

    .actions a {
      border-radius: 4px;
      font-size: 13px;
      font-weight: 750;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .actions a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .loading, .empty, .error {
      padding: var(--space-5);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--muted);
    }

    .loading {
      text-align: center;
    }

    .state-title {
      margin: 0 0 var(--space-2);
      color: var(--text);
      font-family: var(--font-display);
      font-size: 20px;
      line-height: 1.2;
    }

    .state-copy {
      margin: 0;
    }

    .retry-button {
      min-height: 44px;
      margin-top: var(--space-4);
      padding: 8px 14px;
      border: 1px solid var(--accent);
      border-radius: 9px;
      background: var(--accent-soft);
      color: var(--text);
      font: 700 14px/1 var(--font-sans);
      cursor: pointer;
    }

    .retry-button:hover {
      background: #eac9a5;
    }

    .retry-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    footer {
      margin-top: var(--space-8);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    @media (max-width: 720px) {
      .page { width: min(100% - 20px, 960px); padding-top: 14px; }
      .hero-top {
        gap: 8px;
        margin-bottom: 7px;
      }
      .scope-tabs {
        padding: 2px;
      }
      .scope-tabs button {
        min-height: 30px;
        padding: 4px 8px;
        font-size: 11px;
      }
      .hero { padding: 24px 20px 22px; border-radius: 14px; }
      .grid, .best-grid { grid-template-columns: 1fr; }
      .forecast-grid {
        grid-template-columns: 1fr;
        gap: 7px;
      }
      .forecast-day {
        grid-template-columns: 70px 92px minmax(0, 1fr);
        grid-template-areas: "left details note";
        gap: 10px;
        min-height: 100px;
        padding: 10px 12px;
      }
      .forecast-left {
        grid-area: left;
      }
      .forecast-details {
        grid-area: details;
        align-self: center;
      }
      .forecast-icon {
        margin-bottom: 5px;
        font-size: 38px;
      }
      .forecast-day-name {
        font-size: 11px;
      }
      .forecast-date {
        font-size: 10px;
      }
      .forecast-temp {
        font-size: 28px;
        white-space: nowrap;
        line-height: 1.05;
      }
      .forecast-temp span {
        font-size: 14px;
      }
      .forecast-condition {
        margin-top: 5px;
        font-size: 12px;
        line-height: 1.2;
      }
      .forecast-note {
        grid-area: note;
        align-self: center;
        margin: 0;
        padding-left: 10px;
        border-left: 1px solid rgba(59,44,35,.14);
        font-size: 11px;
        line-height: 1.3;
      }
      .section { margin-top: 34px; }
      .section-head { align-items: flex-end; }
      .card { padding: 18px; }
      .card:nth-child(4n + 3),
      .card:nth-child(4n + 4) {
        --action-pair: var(--action-brown);
        --action-pair-hover: var(--action-brown-hover);
        border-top-color: var(--card-accent);
      }
      .card:nth-child(even) {
        --action-pair: var(--action-green);
        --action-pair-hover: var(--action-green-hover);
        border-top-color: var(--card-accent-band);
      }
      .card-head {
        margin: -18px -18px 0;
        padding: 12px 10px 11px 18px;
        background: var(--card-header);
      }
      .card:nth-child(4n + 3) .card-head,
      .card:nth-child(4n + 4) .card-head {
        background: var(--card-header);
      }
      .card:nth-child(even) .card-head {
        background: var(--card-header-band);
      }
      .card-head-actions {
        gap: 9px;
      }
      .card-head-action {
        width: 46px;
        height: 46px;
      }
      .card-head-action .action-icon {
        width: 40px;
        height: 40px;
      }
      .fact { grid-template-columns: 74px minmax(0,1fr); }
    }
  </style>
</head>
<body>
  <main class="page" id="app">
    <section class="hero">
      <div class="hero-top">
        <p class="eyebrow">🍂 Around 20171</p>
        <div class="scope-tabs" role="group" aria-label="Event distance">
          <button type="button" data-scope="local" aria-pressed="true">📍 Local</button>
          <button type="button" data-scope="nova_plus" aria-pressed="false">🚗 nova+</button>
        </div>
      </div>
      <h1>Weekend Activities</h1>
      <div class="weekend" id="weekend">Loading this weekend…</div>
      <div class="weather" id="weather" hidden></div>
    </section>

    <div id="content" aria-live="polite">
      <div class="loading">Loading weekend activities…</div>
    </div>

    <footer>
      Event details can change. Confirm times, prices, weather impacts and availability with the organizer before leaving.
    </footer>
  </main>

  <script>
    const dataUrl = "./data/latest.json";

    function parseDate(value) {
      return new Date(value + "T12:00:00");
    }

    function shortDate(value) {
      return new Intl.DateTimeFormat("en-US", {
        weekday: "short", month: "short", day: "numeric"
      }).format(parseDate(value));
    }

    function longDate(value) {
      return new Intl.DateTimeFormat("en-US", {
        weekday: "long", month: "long", day: "numeric"
      }).format(parseDate(value));
    }

    function weekendRange(report) {
      const start = parseDate(report.weekend_start);
      const end = parseDate(report.weekend_end);
      const startMonth = new Intl.DateTimeFormat("en-US", { month: "long" }).format(start);
      const endMonth = new Intl.DateTimeFormat("en-US", { month: "long" }).format(end);
      if (start.getMonth() === end.getMonth()) {
        return `${startMonth} ${start.getDate()}–${end.getDate()}, ${end.getFullYear()}`;
      }
      return `${startMonth} ${start.getDate()}–${endMonth} ${end.getDate()}, ${end.getFullYear()}`;
    }

    function weatherIcon(conditions) {
      const value = String(conditions || "").toLowerCase();
      if (/thunder|storm/.test(value)) return "⛈️";
      if (/snow|sleet|ice|freezing/.test(value)) return "🌨️";
      if (/rain|shower|drizzle/.test(value)) return "🌧️";
      if (/fog|mist/.test(value)) return "🌫️";
      if (/wind|breezy|gust/.test(value)) return "💨";
      if (/partly|mostly sunny|mostly clear/.test(value)) return "🌤️";
      if (/cloud|overcast/.test(value)) return "☁️";
      if (/sun|clear/.test(value)) return "☀️";
      return "🌦️";
    }

    function eventDateLabel(event) {
      const values = (event.dates || []).slice().sort();
      if (!values.length) return "Date varies";
      if (values.length === 1) return shortDate(values[0]);

      const dates = values.map(parseDate);
      const contiguous = dates.every((date, index) => {
        if (index === 0) return true;
        const previous = dates[index - 1];
        return Math.round((date - previous) / 86400000) === 1;
      });

      if (contiguous && dates[0].getMonth() === dates.at(-1).getMonth()) {
        const firstDay = new Intl.DateTimeFormat("en-US", { weekday: "short" }).format(dates[0]);
        const lastDay = new Intl.DateTimeFormat("en-US", { weekday: "short" }).format(dates.at(-1));
        const month = new Intl.DateTimeFormat("en-US", { month: "short" }).format(dates[0]);
        return `${firstDay}–${lastDay} · ${month} ${dates[0].getDate()}–${dates.at(-1).getDate()}`;
      }

      return values.map(shortDate).join(" · ");
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function metadataIcon(name) {
      const icon = el("span", `meta-icon meta-icon-${name}`);
      icon.setAttribute("aria-hidden", "true");
      return icon;
    }

    function factRow(iconName, label, value) {
      const wrapper = el("div", "fact");
      const dt = el("dt");
      dt.append(metadataIcon(iconName), document.createTextNode(label));
      const dd = el("dd", "", value);
      wrapper.append(dt, dd);
      return wrapper;
    }

    function calendarUrl(event) {
      const dates = (event.dates || []).slice().sort();
      if (!dates.length) return "";

      const start = dates[0].replaceAll("-", "");
      const endDate = new Date(dates[dates.length - 1] + "T12:00:00");
      endDate.setDate(endDate.getDate() + 1);
      const end = [
        endDate.getFullYear(),
        String(endDate.getMonth() + 1).padStart(2, "0"),
        String(endDate.getDate()).padStart(2, "0")
      ].join("");

      const details = [
        event.summary || "",
        event.time ? `Time: ${event.time}` : "",
        event.price ? `Cost: ${event.price}` : "",
        event.source_url ? `Details: ${event.source_url}` : ""
      ].filter(Boolean).join("\n\n");

      const params = new URLSearchParams({
        action: "TEMPLATE",
        text: event.title || "Weekend activity",
        dates: `${start}/${end}`,
        details,
        location: event.address || event.venue || ""
      });

      return `https://calendar.google.com/calendar/render?${params.toString()}`;
    }

    function card(event) {
      const article = el("article", "card");

      const head = el("div", "card-head");
      head.append(el("h3", "", event.title || "Untitled event"));

      const headActions = el("div", "card-head-actions");

      if (event.map_url) {
        const directionsIcon = el("a", "card-head-action");
        directionsIcon.append(el("span", "action-icon action-icon-marker"));
        directionsIcon.href = event.map_url;
        directionsIcon.target = "_blank";
        directionsIcon.rel = "noopener";
        directionsIcon.title = "Directions";
        directionsIcon.setAttribute("aria-label", `Directions to ${event.title || "event"}`);
        headActions.append(directionsIcon);
      }

      const calUrl = calendarUrl(event);
      if (calUrl) {
        const calendarIcon = el("a", "card-head-action");
        calendarIcon.append(el("span", "action-icon action-icon-calendar"));
        calendarIcon.href = calUrl;
        calendarIcon.target = "_blank";
        calendarIcon.rel = "noopener";
        calendarIcon.title = "Add to calendar";
        calendarIcon.setAttribute("aria-label", `Add ${event.title || "event"} to calendar`);
        headActions.append(calendarIcon);
      }

      head.append(headActions);
      article.append(head);

      if (event.buy_now) {
        article.append(el("div", "badge", "⚠️ Plan ahead"));
      }

      const facts = el("dl", "facts");
      facts.append(
        factRow("date", "Date", eventDateLabel(event)),
        factRow("time", "Time", event.time || "Time varies"),
        factRow("place", "Where", [event.venue, event.area].filter(Boolean).join(" · ") || "Location varies"),
        factRow("cost", "Cost", event.price || "Price not confirmed")
      );
      article.append(facts);

      if (event.summary) {
        article.append(el("p", "description", event.summary));
      }

      if (event.registration) {
        const registration = el("p", "registration");
        registration.append(
          metadataIcon("ticket"),
          document.createTextNode(event.registration)
        );
        article.append(registration);
      }

      const actions = el("div", "actions");

      if (event.source_url) {
        const details = el("a", "", "↗ Event details");
        details.href = event.source_url;
        details.target = "_blank";
        details.rel = "noopener";
        actions.append(details);
      }

      article.append(actions);
      return article;
    }

    function addSection(id, title, subtitle, events, best = false) {
      if (!events.length) return;

      const section = el("section", "section");
      section.id = id;

      const head = el("div", "section-head");
      const heading = el("h2", "", title);
      if (!best) heading.classList.add("day-heading");
      head.append(heading);
      if (subtitle) head.append(el("span", "", subtitle));
      section.append(head);

      const grid = el("div", best ? "grid best-grid" : "grid");
      events.forEach(event => grid.append(card(event)));
      section.append(grid);
      document.getElementById("content").append(section);
    }

    function eventScope(event) {
      return event.scope === "nova_plus" ? "nova_plus" : "local";
    }

    function renderScope(report, scope) {
      const content = document.getElementById("content");
      content.replaceChildren();

      document.querySelectorAll("[data-scope]").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.scope === scope));
      });

      localStorage.setItem("weekend-scope", scope);

      const scopedEvents = (report.events || []).filter(event => eventScope(event) === scope);
      const lookup = new Map(scopedEvents.map(event => [event.id, event]));
      const best = (report.best_bet_ids || []).map(id => lookup.get(id)).filter(Boolean);

      if (best.length) {
        addSection(
          `best-bets-${scope}`,
          "⭐ Best Bets",
          scope === "local" ? "Close-by standouts" : "Worth the drive",
          best,
          true
        );
      }

      const start = parseDate(report.weekend_start);
      for (let offset = 0; offset < 3; offset += 1) {
        const day = new Date(start);
        day.setDate(start.getDate() + offset);
        const iso = [
          day.getFullYear(),
          String(day.getMonth() + 1).padStart(2, "0"),
          String(day.getDate()).padStart(2, "0")
        ].join("-");
        const dayEvents = scopedEvents.filter(event => (event.dates || []).includes(iso));
        addSection(
          `${scope}-${iso}`,
          new Intl.DateTimeFormat("en-US", { weekday: "long" }).format(day),
          longDate(iso).replace(/^[^,]+, /, ""),
          dayEvents
        );
      }

      if (!content.children.length) {
        content.append(
          el(
            "div",
            "empty",
            scope === "local"
              ? "No local activities have been published yet."
              : "No nova+ activities have been published yet."
          )
        );
      }
    }

    async function render() {
      const content = document.getElementById("content");
      const weather = document.getElementById("weather");
      const savedScope = localStorage.getItem("weekend-scope");
      const initialScope = savedScope === "nova_plus" ? "nova_plus" : "local";

      document.querySelectorAll("[data-scope]").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.scope === initialScope));
      });

      content.replaceChildren(el("div", "loading", "Loading weekend activities…"));
      weather.hidden = true;
      weather.replaceChildren();

      try {
        const response = await fetch(dataUrl, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const report = await response.json();

        document.title = `Weekend Activities · ${weekendRange(report)}`;
        document.getElementById("weekend").textContent = weekendRange(report);

        const forecast = report.forecast || [];

        if (forecast.length) {
          weather.hidden = false;
          weather.append(el("div", "forecast-title", "🌦️ Weekend forecast"));

          const forecastGrid = el("div", "forecast-grid");
          forecast.forEach(day => {
            const panel = el("div", "forecast-day");
            const dateValue = parseDate(day.date);

            const left = el("div", "forecast-left");
            left.append(el("div", "forecast-icon", weatherIcon(day.conditions)));
            left.append(
              el(
                "div",
                "forecast-day-name",
                new Intl.DateTimeFormat("en-US", { weekday: "long" }).format(dateValue)
              )
            );
            left.append(
              el(
                "div",
                "forecast-date",
                new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric" }).format(dateValue)
              )
            );

            const details = el("div", "forecast-details");
            const temp = el("div", "forecast-temp");
            temp.append(
              document.createTextNode(`${Math.round(day.high_f)}° `),
              (() => {
                const low = el("span", "", `/ ${Math.round(day.low_f)}°`);
                return low;
              })()
            );
            details.append(temp);

            if (day.conditions) {
              details.append(el("div", "forecast-condition", day.conditions));
            }

            panel.append(left, details);
            if (day.notable) {
              panel.append(el("div", "forecast-note", day.notable));
            }
            forecastGrid.append(panel);
          });
          weather.append(forecastGrid);

          if (report.weather_note) {
            weather.append(el("div", "forecast-summary", "👀 " + report.weather_note));
          }
        } else if (report.weather_note) {
          weather.hidden = false;
          const strong = el("strong", "", "Weather: ");
          weather.append(strong, document.createTextNode(report.weather_note));
        }

        document.querySelectorAll("[data-scope]").forEach(button => {
          button.onclick = () => renderScope(report, button.dataset.scope);
        });

        renderScope(report, initialScope);
      } catch (error) {
        if (document.getElementById("weekend").textContent.includes("Loading")) {
          document.getElementById("weekend").textContent = "Weekend data unavailable";
        }

        const state = el("div", "error");
        state.append(
          el("div", "state-title", "Weekend list couldn’t load"),
          el("p", "state-copy", "Your Local / nova+ choice is unchanged.")
        );
        const retry = el("button", "retry-button", "Try again");
        retry.type = "button";
        retry.addEventListener("click", render);
        state.append(retry);
        content.replaceChildren(state);
        console.error(error);
      }
    }

    render();
  </script>
</body>
</html>
