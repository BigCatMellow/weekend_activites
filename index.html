<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Weekend Activities · 20171</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #efe3d1;
      --surface: #fffaf2;
      --surface-soft: #f7ead8;
      --hero-end: #f5dfc4;
      --text: #3b2c23;
      --muted: #78675b;
      --line: #dcc6aa;
      --accent: #a64f24;
      --accent-2: #6f713f;
      --accent-soft: #f1d8bd;
      --warning: #8c3f22;
      --warning-bg: #f7ddcd;
      --link: #7d371c;
      --shadow: 0 1px 2px rgba(80,45,20,.05), 0 10px 28px rgba(80,45,20,.08);
      --card-header: #efd2ad;
      --card-header-band: #d8d6ad;
      --card-accent: #a64f24;
      --card-accent-band: #6f713f;
    }

    body[data-theme="neutral"] {
      --bg: #f3f2ef;
      --surface: #ffffff;
      --surface-soft: #f7f6f3;
      --hero-end: #f7f6f3;
      --text: #202124;
      --muted: #686b70;
      --line: #deddd9;
      --accent: #315f4f;
      --accent-2: #315f4f;
      --accent-soft: #e7f0eb;
      --warning: #7a5200;
      --warning-bg: #fff1cc;
      --link: #2457a6;
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
      --card-header: #e8ebe7;
      --card-header-band: #dde3dd;
      --card-accent: #315f4f;
      --card-accent-band: #68756d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      transition: background-color .18s ease, color .18s ease;
    }

    a { color: var(--link); }

    .page {
      width: min(960px, calc(100% - 28px));
      margin: 0 auto;
      padding: 34px 0 64px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .theme-switch {
      display: inline-flex;
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .theme-switch button {
      border: 0;
      border-radius: 999px;
      padding: 6px 10px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
    }

    .theme-switch button[aria-pressed="true"] {
      background: var(--accent-soft);
      color: var(--text);
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 30px;
      background: linear-gradient(135deg, var(--surface) 0%, var(--hero-end) 100%);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 5px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(34px, 7vw, 52px);
      line-height: 1.03;
      letter-spacing: -.035em;
    }

    .weekend {
      margin-top: 9px;
      color: var(--muted);
      font-size: 17px;
    }

    .weather {
      margin-top: 24px;
      padding: 15px 17px;
      border-left: 4px solid var(--accent);
      background: var(--surface-soft);
      border-radius: 0 10px 10px 0;
      color: var(--muted);
    }

    .weather strong { color: var(--text); }

    .forecast-title {
      margin: 0 0 10px;
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .forecast-day {
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
    }

    .forecast-icon {
      margin-bottom: 4px;
      font-size: 30px;
      line-height: 1;
    }

    .forecast-day-name {
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .forecast-temp {
      margin-top: 3px;
      color: var(--text);
      font-size: 22px;
      font-weight: 800;
      line-height: 1.15;
    }

    .forecast-temp span {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .forecast-condition {
      margin-top: 4px;
      color: var(--text);
      font-size: 13px;
      font-weight: 650;
    }

    .forecast-note {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .forecast-summary {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .jump {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 18px 0 0;
    }

    .jump a {
      display: inline-block;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      transition: background-color .15s ease, border-color .15s ease;
      font-size: 13px;
      font-weight: 700;
    }

    .jump a:hover,
    .jump a:focus-visible {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .section { margin-top: 42px; }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--accent);
    }

    .section-head h2 {
      margin: 0;
      color: var(--accent);
      font-size: 25px;
      letter-spacing: -.02em;
    }

    .section-head span {
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .best-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .card {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--line);
      border-top: 4px solid var(--card-accent);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .card:nth-child(4n + 3),
    .card:nth-child(4n + 4) {
      border-top-color: var(--card-accent-band);
    }

    .card h3 {
      margin: -20px -20px 0;
      padding: 14px 20px 13px;
      border-bottom: 1px solid var(--line);
      background: var(--card-header);
      color: var(--text);
      font-size: 21px;
      line-height: 1.18;
      letter-spacing: -.015em;
    }

    .card:nth-child(4n + 3) h3,
    .card:nth-child(4n + 4) h3 {
      background: var(--card-header-band);
    }

    .badge {
      align-self: flex-start;
      margin-top: 9px;
      padding: 4px 7px;
      border-radius: 6px;
      background: var(--warning-bg);
      color: var(--warning);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .055em;
      text-transform: uppercase;
    }

    .facts {
      margin: 15px 0 0;
      padding-left: 12px;
      border-left: 2px solid var(--accent-soft);
    }

    .fact {
      display: grid;
      grid-template-columns: 82px minmax(0,1fr);
      gap: 8px;
      margin: 5px 0;
      font-size: 13px;
    }

    .fact dt {
      margin: 0;
      color: var(--muted);
      font-weight: 700;
    }

    .fact dd {
      margin: 0;
      min-width: 0;
    }

    .description {
      margin: 15px 0 0;
      font-size: 14px;
      color: var(--text);
    }

    .registration {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: auto;
      padding-top: 16px;
    }

    .actions a {
      font-size: 13px;
      font-weight: 750;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .empty, .error {
      padding: 22px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--muted);
    }

    footer {
      margin-top: 42px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 720px) {
      .page { width: min(100% - 20px, 960px); padding-top: 14px; }
      .topbar { justify-content: flex-start; margin-bottom: 8px; }
      .hero { padding: 24px 20px 22px; border-radius: 14px; }
      .grid, .best-grid { grid-template-columns: 1fr; }
      .forecast-grid { grid-template-columns: 1fr; }
      .section { margin-top: 34px; }
      .section-head { align-items: flex-end; }
      .card { padding: 18px; }
      .card:nth-child(4n + 3),
      .card:nth-child(4n + 4) {
        border-top-color: var(--card-accent);
      }
      .card:nth-child(even) {
        border-top-color: var(--card-accent-band);
      }
      .card h3 {
        margin: -18px -18px 0;
        padding: 13px 18px 12px;
        background: var(--card-header);
      }
      .card:nth-child(4n + 3) h3,
      .card:nth-child(4n + 4) h3 {
        background: var(--card-header);
      }
      .card:nth-child(even) h3 {
        background: var(--card-header-band);
      }
      .fact { grid-template-columns: 74px minmax(0,1fr); }
    }
  </style>
</head>
<body data-theme="fall">
  <main class="page" id="app">
    <div class="topbar">
      <div class="theme-switch" aria-label="Color theme">
        <button type="button" data-theme-choice="fall" aria-pressed="true">🍂 Fall</button>
        <button type="button" data-theme-choice="neutral" aria-pressed="false">Neutral</button>
      </div>
    </div>
    <section class="hero">
      <p class="eyebrow">🍂 Around 20171</p>
      <h1>Weekend Activities</h1>
      <div class="weekend" id="weekend">Loading this weekend…</div>
      <div class="weather" id="weather" hidden></div>
      <nav class="jump" id="jump" aria-label="Jump to a section"></nav>
    </section>

    <div id="content" aria-live="polite"></div>

    <footer>
      Event details can change. Confirm times, prices, weather impacts and availability with the organizer before leaving.
    </footer>
  </main>

  <script>
    const themeButtons = [...document.querySelectorAll("[data-theme-choice]")];
    const savedTheme = localStorage.getItem("weekend-theme");
    const initialTheme = savedTheme === "neutral" ? "neutral" : "fall";

    function setTheme(theme) {
      document.body.dataset.theme = theme;
      themeButtons.forEach(button => {
        button.setAttribute(
          "aria-pressed",
          String(button.dataset.themeChoice === theme)
        );
      });
      localStorage.setItem("weekend-theme", theme);
    }

    themeButtons.forEach(button => {
      button.addEventListener("click", () => setTheme(button.dataset.themeChoice));
    });
    setTheme(initialTheme);

    const dataUrl = "./data/latest.json";

    function parseDate(value) {
      return new Date(value + "T12:00:00");
    }

    function shortDate(value) {
      return new Intl.DateTimeFormat("en-US", {
        weekday: "short", month: "short", day: "numeric"
      }).format(parseDate(value));
    }

    function longDate(value) {
      return new Intl.DateTimeFormat("en-US", {
        weekday: "long", month: "long", day: "numeric"
      }).format(parseDate(value));
    }

    function weekendRange(report) {
      const start = parseDate(report.weekend_start);
      const end = parseDate(report.weekend_end);
      const startMonth = new Intl.DateTimeFormat("en-US", { month: "long" }).format(start);
      const endMonth = new Intl.DateTimeFormat("en-US", { month: "long" }).format(end);
      if (start.getMonth() === end.getMonth()) {
        return `${startMonth} ${start.getDate()}–${end.getDate()}, ${end.getFullYear()}`;
      }
      return `${startMonth} ${start.getDate()}–${endMonth} ${end.getDate()}, ${end.getFullYear()}`;
    }

    function weatherIcon(conditions) {
      const value = String(conditions || "").toLowerCase();
      if (/thunder|storm/.test(value)) return "⛈️";
      if (/snow|sleet|ice|freezing/.test(value)) return "🌨️";
      if (/rain|shower|drizzle/.test(value)) return "🌧️";
      if (/fog|mist/.test(value)) return "🌫️";
      if (/wind|breezy|gust/.test(value)) return "💨";
      if (/partly|mostly sunny|mostly clear/.test(value)) return "🌤️";
      if (/cloud|overcast/.test(value)) return "☁️";
      if (/sun|clear/.test(value)) return "☀️";
      return "🌦️";
    }

    function eventDateLabel(event) {
      const values = (event.dates || []).slice().sort();
      if (!values.length) return "Date varies";
      if (values.length === 1) return shortDate(values[0]);

      const dates = values.map(parseDate);
      const contiguous = dates.every((date, index) => {
        if (index === 0) return true;
        const previous = dates[index - 1];
        return Math.round((date - previous) / 86400000) === 1;
      });

      if (contiguous && dates[0].getMonth() === dates.at(-1).getMonth()) {
        const firstDay = new Intl.DateTimeFormat("en-US", { weekday: "short" }).format(dates[0]);
        const lastDay = new Intl.DateTimeFormat("en-US", { weekday: "short" }).format(dates.at(-1));
        const month = new Intl.DateTimeFormat("en-US", { month: "short" }).format(dates[0]);
        return `${firstDay}–${lastDay} · ${month} ${dates[0].getDate()}–${dates.at(-1).getDate()}`;
      }

      return values.map(shortDate).join(" · ");
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function factRow(icon, label, value) {
      const wrapper = el("div", "fact");
      const dt = el("dt", "", `${icon} ${label}`);
      const dd = el("dd", "", value);
      wrapper.append(dt, dd);
      return wrapper;
    }

    function card(event) {
      const article = el("article", "card");
      article.append(el("h3", "", event.title || "Untitled event"));

      if (event.buy_now) {
        article.append(el("div", "badge", "⚠️ Plan ahead"));
      }

      const facts = el("dl", "facts");
      facts.append(
        factRow("📅", "Date", eventDateLabel(event)),
        factRow("🕒", "Time", event.time || "Time varies"),
        factRow("📍", "Where", [event.venue, event.area].filter(Boolean).join(" · ") || "Location varies"),
        factRow("💵", "Cost", event.price || "Price not confirmed")
      );
      article.append(facts);

      if (event.summary) {
        article.append(el("p", "description", event.summary));
      }

      if (event.registration) {
        article.append(el("p", "registration", `🎟️ ${event.registration}`));
      }

      const actions = el("div", "actions");

      if (event.map_url) {
        const directions = el("a", "", "🗺️ Directions");
        directions.href = event.map_url;
        directions.target = "_blank";
        directions.rel = "noopener";
        actions.append(directions);
      }

      if (event.source_url) {
        const details = el("a", "", "↗ Event details");
        details.href = event.source_url;
        details.target = "_blank";
        details.rel = "noopener";
        actions.append(details);
      }

      article.append(actions);
      return article;
    }

    function addSection(id, title, subtitle, events, best = false) {
      if (!events.length) return;

      const section = el("section", "section");
      section.id = id;

      const head = el("div", "section-head");
      head.append(el("h2", "", title));
      if (subtitle) head.append(el("span", "", subtitle));
      section.append(head);

      const grid = el("div", best ? "grid best-grid" : "grid");
      events.forEach(event => grid.append(card(event)));
      section.append(grid);
      document.getElementById("content").append(section);

      const jump = el("a", "", title);
      jump.href = `#${id}`;
      document.getElementById("jump").append(jump);
    }

    async function render() {
      try {
        const response = await fetch(dataUrl, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const report = await response.json();

        document.title = `Weekend Activities · ${weekendRange(report)}`;
        document.getElementById("weekend").textContent = weekendRange(report);

        const weather = document.getElementById("weather");
        const forecast = report.forecast || [];

        if (forecast.length) {
          weather.hidden = false;
          weather.append(el("div", "forecast-title", "🌦️ Weekend forecast"));

          const forecastGrid = el("div", "forecast-grid");
          forecast.forEach(day => {
            const panel = el("div", "forecast-day");
            const dateValue = parseDate(day.date);
            panel.append(el("div", "forecast-icon", weatherIcon(day.conditions)));
            panel.append(
              el(
                "div",
                "forecast-day-name",
                new Intl.DateTimeFormat("en-US", { weekday: "long" }).format(dateValue)
              )
            );

            const temp = el("div", "forecast-temp");
            temp.append(
              document.createTextNode(`${Math.round(day.high_f)}° `),
              (() => {
                const low = el("span", "", `/ ${Math.round(day.low_f)}°`);
                return low;
              })()
            );
            panel.append(temp);

            if (day.conditions) {
              panel.append(el("div", "forecast-condition", day.conditions));
            }
            if (day.notable) {
              panel.append(el("div", "forecast-note", day.notable));
            }
            forecastGrid.append(panel);
          });
          weather.append(forecastGrid);

          if (report.weather_note) {
            weather.append(el("div", "forecast-summary", "👀 " + report.weather_note));
          }
        } else if (report.weather_note) {
          weather.hidden = false;
          const strong = el("strong", "", "Weather: ");
          weather.append(strong, document.createTextNode(report.weather_note));
        }

        const lookup = new Map((report.events || []).map(event => [event.id, event]));
        const best = (report.best_bet_ids || []).map(id => lookup.get(id)).filter(Boolean);
        addSection("best-bets", "⭐ Best Bets", "A varied shortlist", best, true);

        const start = parseDate(report.weekend_start);
        for (let offset = 0; offset < 3; offset += 1) {
          const day = new Date(start);
          day.setDate(start.getDate() + offset);
          const iso = [
            day.getFullYear(),
            String(day.getMonth() + 1).padStart(2, "0"),
            String(day.getDate()).padStart(2, "0")
          ].join("-");
          const dayEvents = (report.events || []).filter(event => (event.dates || []).includes(iso));
          addSection(
            iso,
            "🗓️ " + new Intl.DateTimeFormat("en-US", { weekday: "long" }).format(day),
            longDate(iso).replace(/^[^,]+, /, ""),
            dayEvents
          );
        }

        if (!document.getElementById("content").children.length) {
          document.getElementById("content").append(
            el("div", "empty", "No weekend activities have been published yet.")
          );
        }
      } catch (error) {
        const message = el(
          "div",
          "error",
          "The latest weekend list could not be loaded. Try refreshing in a moment."
        );
        document.getElementById("content").append(message);
        console.error(error);
      }
    }

    render();
  </script>
</body>
</html>
